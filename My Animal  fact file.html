<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: black;
            font-family: Arial, Helvetica, sans-serif;
        }
        .fact-file{
            background-color: white;
            color: black;
            width: 260px;
            padding: 25px;
            border: 10px solid rgb(255, 0, 0);
            margin: 30px;
        }
        .animal-name{
            color: chocolate;
            font-size: 25px;
        }
        .detail{
            color: chartreuse;
        }
        .cool-fact{
            color: hotpink;
            font-style: italic;
        }

    </style>
</head>
<body>
    <div class="fact-file">
        <h2 class="animal-name">Snow Leopard</h2>
        <p class="details">Type:big cat</p>
        <p class="details">Lives in:mountain ranges of central Aisa.</p>
        <p class="details">Diet:Deer,Goats and wild sheep.</p>
        <p class="cool-fact">Cool-fact:can leap up to 15 meters in one jump.</p>



    </div>
</body>
</html>

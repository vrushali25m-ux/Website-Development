<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> My food menu</title>
    <style>
        body{
            font-family: Arial;
            background-color: bisque;
            padding: 30px;
            text-align: center;

        }

        h1 {color: lightblue;}

        h1 +p {
            background-color: blanchedalmond;
            padding: 10px 20px;
            border-radius: 8px;
            color: antiquewhite;
            display: inline-block;


        }
        ul{padding:0; margin-top: 20px;}
        ul>li{
            list-style:none;
            font-size: 18px;
            font-weight: bold;
            color: cyan;
            padding: 10px 20px;
            margin: 6px auto;
            width: 260px;
            background-color: lightsalmon;
            border-radius: 8px;

        }

        ul li:nth-child (3){
            background-color:light pink;
            color:blue;


        }
        .desc{
            color: palevioletred;
            margin-top: 20px;
            font-size: 15px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;

        }
        .desc:: ::first-letter{
            font-size: 220%;
            color: yellow;
            font-size: bold;
        }
        .links{margin-top:25px}
        a{
            color: aqua;
            text-decoration: none;
            font-size: 15px;
            margin: 0 12px;
            padding: 8px 18px;
            border: 2px solid #e65c00;
            border-radius: 8px;


        }
        a:hover{
            background: rgb(1, 255, 1);
            color: white;


        }

        

    </style>

</head>

<body>
    <h1>MY FOOD MENU</h1>
    <h2>Pick any dish you want.</h2>
    <ul>
        <li>Pizza</li>
        <li>Burger</li>
        <li>Tacos- chef's special</li>
        <li>Noodels</li>
        <li>Icecream</li>
    </ul>
    <p class="desc">Every dish on this menu is made with love and loads of flavour.<br>Try all of them and find your favourite! </p>
    <div class="links">
        <a href="#">Order now</a>
        <a href="#">See more</a>
    </div>


    
</body>
</html>

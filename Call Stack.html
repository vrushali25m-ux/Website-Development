<html>
    <body>
        <h2>JavaScript Functions</h2>
        <p>DO a calculation and then display the results.</p>
        <p id="demo"></p>
        
        <script>
            function add(a, b) {
                return a + b;
            }
            function avarage(a, b) {
                return  add (a, b) / 2;
            }
            let result = avarage(10, 20);
            document.getElementById("demo").innerHTML = result;

        </script>
    </body>
</html>
